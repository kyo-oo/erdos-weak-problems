name: Erdos One-Shot Kills CI (271 + 404 + 261 + 1108 + ARSENAL + 686 PellRatio + 727 FactorialSquare + 1056 FactorialIntervals)
on:
  push:
    branches: ['**']
    paths:
      - bulldoze/problem271-stanley-a2/StanleyA2.lean
      - bulldoze/problem404-padic-kernel/KernelLaw.lean
      - bulldoze/problem261-two-solutions/**
      - bulldoze/problem261-continuum-tower/**
      - problem404-full/**
      - problem261-q3bridge/**
      - problem404-gadget-supply/**
      - problem261-funnels/**
      - problem404-p2-classification/**
      - problem404-q3-chain/**
      - problem1108-subset-kernel/**
      - Arsenal/**
      - lakefile.toml
      - problem686-pell-ratio/**
      - problem374-factorial-square/**
      - problem727-factorial-square/**
      - problem1056-factorial-intervals/**
      - problem700-binomial-gcd/**
      - problem1063-binomial-frontier/**
      - problem451-interval-prime-free/**
      - problem1072-wilson-chain/**
      - problem394-consecutive-crt/**
      - problem711-divisor-matching/**
      - problem961-smooth-runs/**
      - problem686-pell-ratio/**
      - problem1074-ehs-pillai/**
      - problem282-odd-greedy/**
      - problem954-rosen-sequence/**
      - problem1108-allprime/**
      - problem396-prod-binomial/**
      - problem1073-factorial-mod/**
      - problem461-smooth-component/**
      - problem271-status/**
      - problem261-full/**
      - problem406-ternary-powers/**
      - problem306-semiprime-egyptian/**
      - problem885-factor-difference/**
      - problem243-sylvester/**
      - problem124-begl96/**
      - problem677-equal-lcm/**
      - problem348-redundant-complete/**
      - problem274-coset-tilings/**
      - problem288-two-interval/**
      - problem850-radical-triple/**
      - problem708-product-divisibility/**
      - problem939-rpowerful/**
      - problem411-iterated-totient/**
      - problem317-signed-harmonic/**
      - problem273-pminus1-covering/**
      - problem289-intervals/**
      - problem1212-coprime-composite/**
      - problem389-consecutive-product/**
      - .github/workflows/kills.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel-a:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Lean Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Kernel 1 - Erdos 271 Stanley S(0,2) complete characterization
        shell: bash
        run: |
          set -euo pipefail
          lake env lean bulldoze/problem271-stanley-a2/StanleyA2.lean 2>&1 | tee stanley-a2.log
          ! grep -E 'error:|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.' stanley-a2.log
          grep -F "[0, 2, 3, 5, 9, 11, 12, 14, 27, 29, 30, 32, 36, 38, 39, 41]" stanley-a2.log
          grep -F "[1, 2, 4, 8, 16, 32, 64, 128]" stanley-a2.log
          echo STANLEY_A2_KERNEL_GREEN=1
      - name: Kernel 2 - Erdos 404 left-factorial kernel law
        shell: bash
        run: |
          set -euo pipefail
          lake env lean bulldoze/problem404-padic-kernel/KernelLaw.lean 2>&1 | tee kernel-law.log
          ! grep -E 'error:|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.' kernel-law.log
          grep -F "[3, 3, 3]" kernel-law.log
          grep -F "[7, 7]" kernel-law.log
          grep -F "[10, 10]" kernel-law.log
          grep -F "(3, 7, 10)" kernel-law.log
          echo KERNEL_LAW_GREEN=1
      - name: Kernel 3 - Erdos 261 weakened two-solutions question (Kill #5)
        shell: bash
        run: |
          set -euo pipefail
          lake env lean bulldoze/problem261-two-solutions/TwoSolutions.lean 2>&1 | tee two-solutions.log
          ! grep -E 'error:|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.' two-solutions.log
          test "$(grep -cF '(1 : Rat)/2' two-solutions.log)" -ge 3
          grep -F "(128, 128, 128)" two-solutions.log
          grep -F "(104, 104)" two-solutions.log
          grep -F "'erdos261_weakened_two_solutions' does not depend on any axioms" two-solutions.log
          grep -F "'erdos261_three_solutions' does not depend on any axioms" two-solutions.log
          echo TWO_SOLUTIONS_KERNEL_GREEN=1
      - name: Kernel 4 - Erdos 261 CONTINUUM question, real-x tower (Kill #6)
        shell: bash
        run: |
          set -euo pipefail
          lake env lean bulldoze/problem261-continuum-tower/Erdos261Tower.lean 2>&1 | tee tower.log
          ! grep -E 'error:|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.' tower.log
          grep -F "(1, 4, 11, 26, 57, 120, 247, 502)" tower.log
          grep -F "(2, 2)" tower.log
          grep -F "(16, 16)" tower.log
          grep -F "(88, 88)" tower.log
          grep -F "(416, 416)" tower.log
          grep -F "(1824, 1824)" tower.log
          grep -F "(54430251538710528, 54430251538710528, 54430251538710528)" tower.log
          grep -F "(502030460001114580558742593210417152, 502030460001114580558742593210417152, 502030460001114580558742593210417152)" tower.log
          grep -F "'Erdos261Tower.erdos261_continuum' depends on axioms: [propext, Quot.sound]" tower.log
          grep -F "'Erdos261Tower.tower_cauchy' depends on axioms: [propext, Quot.sound]" tower.log
          echo TOWER_KERNEL_GREEN=1
      - name: "Kernel 5 - Erdos 404 FULL problem (p-adic reduction + odd-a class + f42 exact)"
        shell: bash
        run: |
          set -euo pipefail
          lake env lean problem404-full/PadicReduction.lean 2>&1 | tee padic-reduction.log
          ! grep -E 'error:|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.' padic-reduction.log
          grep -F "5184" padic-reduction.log
          grep -F "(1, 1)" padic-reduction.log
          grep -F "(3, 3)" padic-reduction.log
          grep -F "(4, 4)" padic-reduction.log
          grep -F "(5760, 5760)" padic-reduction.log
          grep -F "(46080, 46080)" padic-reduction.log
          grep -xF "18" padic-reduction.log
          grep -xF "23" padic-reduction.log
          grep -cF "depends on axioms" padic-reduction.log
          grep -F "'erdos404_split' depends on axioms" padic-reduction.log
          grep -F "'erdos404_odd_a' depends on axioms" padic-reduction.log
          grep -F "'erdos404_f42' depends on axioms" padic-reduction.log
          grep -F "'block_pair' depends on axioms" padic-reduction.log
          grep -F "'block_triple' depends on axioms" padic-reduction.log
          echo PADIC_REDUCTION_KERNEL_GREEN=1
      - name: "Kernel 6 - Erdos 261 Q3 bridge (block identity family)"
        shell: bash
        run: |
          set -euo pipefail
          lake env lean problem261-q3bridge/BlockIdentity.lean 2>&1 | tee block-identity.log
          ! grep -E 'error:|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.' block-identity.log
          grep -F "(16, 16)" block-identity.log
          grep -F "(88, 88)" block-identity.log
          grep -F "(416, 416)" block-identity.log
          grep -F "[1, 4, 11, 26, 57, 120, 247, 502]" block-identity.log
          grep -F "(128, 128, 128)" block-identity.log
          grep -F "'bl_family' depends on axioms" block-identity.log
          grep -F "'jpow_sum_eq' depends on axioms" block-identity.log
          grep -F "'pow_sum_eq' depends on axioms" block-identity.log
          echo BLOCK_IDENTITY_KERNEL_GREEN=1
      - name: "Kernel 7 - Erdos 404 sub-Q3 gadget-supply program (lift/pair/triple laws)"
        shell: bash
        run: |
          set -euo pipefail
          lake env lean problem404-gadget-supply/GadgetSupply.lean 2>&1 | tee gadget-supply.log
          ! grep -E 'error:|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.' gadget-supply.log
          grep -cF "depends on axioms" gadget-supply.log
          grep -F "'lift_law' depends on axioms: [propext, Quot.sound]" gadget-supply.log
          grep -F "'pair_law' depends on axioms: [propext, Quot.sound]" gadget-supply.log
          grep -F "'triple_law' depends on axioms: [propext, Quot.sound]" gadget-supply.log
          grep -F "25854571308224545292288" gadget-supply.log
          grep -xF "23" gadget-supply.log
          echo GADGET_SUPPLY_KERNEL_GREEN=1
      - name: "Kernel 8 - Erdos 261 funnels (coalescence determinism + census)"
        shell: bash
        run: |
          set -euo pipefail
          lake env lean problem261-funnels/FunnelStructure.lean 2>&1 | tee funnels.log
          ! grep -E 'error:|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.' funnels.log
          grep -F "'death_fuel_mono' depends on axioms: [propext, Quot.sound]" funnels.log
          grep -F "(12231, 393, 217, 12231)" funnels.log
          grep -xF "192" funnels.log
          grep -xF "155943" funnels.log
          echo FUNNELS_KERNEL_GREEN=1
      - name: "Kernel 9 - Erdos 404 p=2 CLASSIFICATION: obstruction families (T2/T3/T4/T5/T6/T6b/T6c/T7/T7b)"
        shell: bash
        run: |
          set -euo pipefail
          lake env lean problem404-p2-classification/ObstructionFamilies.lean 2>&1 | tee p2class.log
          ! grep -E 'error:|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.' p2class.log
          grep -F "'obs_T2' depends on axioms: [propext, Quot.sound]" p2class.log
          grep -F "'obs_T3' depends on axioms: [propext, Quot.sound]" p2class.log
          grep -F "'obs_T4' depends on axioms: [propext, Classical.choice, Quot.sound]" p2class.log
          grep -F "'f404_T2_bound' depends on axioms: [propext, Quot.sound]" p2class.log
          grep -F "'f404_T2_exact' depends on axioms: [propext, Quot.sound]" p2class.log
          grep -F "'f404_T3_bound' depends on axioms: [propext, Quot.sound]" p2class.log
          grep -F "'f404_T3_exact' depends on axioms: [propext, Quot.sound]" p2class.log
          grep -F "'f404_T4_bound' depends on axioms: [propext, Classical.choice, Quot.sound]" p2class.log
          grep -F "'f404_T4_exact_32' depends on axioms: [propext, Classical.choice, Quot.sound]" p2class.log
          grep -F "'f404_T4_exact_48' depends on axioms: [propext, Classical.choice, Quot.sound]" p2class.log
          grep -F "'obs_T5' depends on axioms: [propext, Classical.choice, Quot.sound]" p2class.log
          grep -F "'f404_T5_bound' depends on axioms: [propext, Classical.choice, Quot.sound]" p2class.log
          grep -F "'f404_T5_exact' depends on axioms: [propext, Classical.choice, Quot.sound]" p2class.log
          grep -F "'obs_T6' depends on axioms: [propext, Classical.choice, Quot.sound]" p2class.log
          grep -F "'f404_T6_bound' depends on axioms: [propext, Classical.choice, Quot.sound]" p2class.log
          grep -F "'f404_T6_exact' depends on axioms: [propext, Classical.choice, Quot.sound]" p2class.log
          grep -F "'obs_T6b' depends on axioms: [propext, Classical.choice, Quot.sound]" p2class.log
          grep -F "'f404_T6b_bound' depends on axioms: [propext, Classical.choice, Quot.sound]" p2class.log
          grep -F "'f404_T6b_exact' depends on axioms: [propext, Classical.choice, Quot.sound]" p2class.log
          grep -F "'obs_T6c' depends on axioms: [propext, Classical.choice, Quot.sound]" p2class.log
          grep -F "'f404_T6c_bound' depends on axioms: [propext, Classical.choice, Quot.sound]" p2class.log
          grep -F "'f404_T6c_exact' depends on axioms: [propext, Classical.choice, Quot.sound]" p2class.log
          grep -F "'obs_T7' depends on axioms: [propext, Classical.choice, Quot.sound]" p2class.log
          grep -F "'f404_T7_bound' depends on axioms: [propext, Classical.choice, Quot.sound]" p2class.log
          grep -F "'f404_T7_exact' depends on axioms: [propext, Classical.choice, Quot.sound]" p2class.log
          grep -F "'obs_T7b' depends on axioms: [propext, Classical.choice, Quot.sound]" p2class.log
          grep -F "'f404_T7b_bound' depends on axioms: [propext, Classical.choice, Quot.sound]" p2class.log
          grep -F "'f404_T7b_exact' depends on axioms: [propext, Classical.choice, Quot.sound]" p2class.log
          grep -xF "6" p2class.log
          grep -xF "13" p2class.log
          grep -xF "37" p2class.log
          grep -xF "52" p2class.log
          grep -xF "76" p2class.log
          grep -xF "140" p2class.log
          grep -xF "203" p2class.log
          grep -xF "45" p2class.log
          grep -xF "172" p2class.log
          grep -xF "300" p2class.log
          grep -xF "427" p2class.log
          grep -xF "60" p2class.log
          grep -xF "187" p2class.log
          grep -xF "92" p2class.log
          grep -xF "219" p2class.log
          grep -xF "77" p2class.log
          grep -xF "204" p2class.log
          grep -xF "332" p2class.log
          grep -xF "459" p2class.log
          grep -xF "123" p2class.log
          grep -xF "250" p2class.log
          echo P2CLASS_KERNEL_GREEN=1
      - name: Independent verification battery
        shell: bash
        run: |
          python3 bulldoze/scripts/verify_bulldoze.py
          python3 bulldoze/problem261-two-solutions/verify_frontiers.py
          python3 bulldoze/problem261-continuum-tower/verify_tower261.py
          python3 problem404-full/verify_404.py
          python3 problem404-gadget-supply/verify_gadgets.py
          python3 problem261-funnels/funnels.py
          python3 problem404-p2-classification/verify_p2class.py
          python3 problem404-q3-chain/verify_f22.py
          python3 problem404-q3-chain/verify_f62.py
          python3 problem1108-subset-kernel/verify_cascade.py
          python3 problem1108-subset-kernel/verify_legendre.py
      - name: Kernel 10 (Erdos 404 ExactF22 — f(2,2) = 254, UNCONDITIONAL)
        run: |
          set -euo pipefail
          # §7 THE MODULE CHAIN — every module its own lean process (memory walls),
          # olean ladder in dependency order. ~5 min wall.
          mkdir -p oleans && export LEAN_PATH="$PWD/oleans"
          : > kernel10.log
          for M in ExactF22 F22DataS F22DataC F22DataD1 F22DataD2 F22Chain F22SweepA F22SweepB F22Coins F22FM0 F22FM1 F22DD0 F22DD1 F22DD2 F22DD3 F22DD4 F22DD5 F22DD6 F22DD7 F22DD8 F22DD9 F22DDm0 F22DDm1 F22DDm2 F22DDm3 F22DDm4 F22DDm5 F22DDm6 F22Asm0 F22Asm1 F22AllA F22AllB F22AllC F22AllD F22AllE F22AllF F22AllG F22AllH F22All; do
            echo "=== $M ===" >> kernel10.log
            lake env lean -o oleans/$M.olean problem404-q3-chain/$M.lean 2>&1 | tee -a kernel10.log
          done
          ! grep -E 'error:|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.' kernel10.log
          grep -F "254" kernel10.log | head -3
          grep -F "118" kernel10.log
          grep -F "true" kernel10.log | head -3
          grep -F "'obstructionCheck_true' depends on axioms: [propext, Quot.sound]" kernel10.log
          grep -F "'erdos404_f22_final' depends on axioms: [propext, Classical.choice, Quot.sound]" kernel10.log


      - name: "Kernel 11 - Erdos 404 Theorem B for EVERY prime (the p | a+1 class, Kill #15)"
        shell: bash
        run: |
          set -euo pipefail
          lake env lean problem404-full/TheoremBGeneral.lean 2>&1 | tee theorem-b-general.log
          ! grep -E 'error:|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.' theorem-b-general.log
          grep -F "(3, 2, 2, 1)" theorem-b-general.log
          test "$(grep -cF '(0, 0)' theorem-b-general.log)" -ge 3
          grep -F "(3, 3)" theorem-b-general.log
          test "$(grep -cF '(2, 2)' theorem-b-general.log)" -ge 2
          grep -F "'erdos404_theoremB' depends on axioms: [propext, Quot.sound]" theorem-b-general.log
          echo THEOREM_B_GENERAL_KERNEL_GREEN=1

      - name: "Kernel 12 - Erdos 404 ExactF62 (f(6,2) = 133 exact, Kill #16)"
        shell: bash
        run: |
          set -euo pipefail
          lake env lean problem404-q3-chain/ExactF62.lean 2>&1 | tee exact-f62.log
          ! grep -E 'error:|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.' exact-f62.log
          grep -F "'erdos404_f62_lower' depends on axioms: [propext, Quot.sound]" exact-f62.log
          grep -F "'erdos404_f62_exact' depends on axioms: [propext, Classical.choice, Quot.sound]" exact-f62.log
          echo EXACT_F62_KERNEL_GREEN=1

      - name: "Kernel 13 - Erdos 1108 subset kernel + FULL PAIR-CASCADE LAW (Kill #17)"
        shell: bash
        run: |
          set -euo pipefail
          lake env lean problem1108-subset-kernel/SubsetKernelLaw.lean 2>&1 | tee subset-kernel.log
          ! grep -E 'error:|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.' subset-kernel.log
          grep -F "(4, 3, 1)" subset-kernel.log
          grep -F "(6, 3, 3)" subset-kernel.log
          grep -F "(3, 1, 2)" subset-kernel.log
          grep -F "(0, 0, 0)" subset-kernel.log
          test "$(grep -cF "1401602635449" subset-kernel.log)" -ge 2
          grep -F "'isolated_min_v2' depends on axioms" subset-kernel.log
          grep -F "'square_pair_singleton_even' depends on axioms" subset-kernel.log
          grep -F "'full_cascade_v2' depends on axioms" subset-kernel.log
          grep -F "'square_cascade_even' depends on axioms" subset-kernel.log
          echo SUBSET_KERNEL_KERNEL_GREEN=1

      - name: "Kernel 14 - Erdos 404 ExactF62 CHAIN (f(6,2) = 133, UNCONDITIONAL - the §7 freeze, Kill #18)"
        shell: bash
        run: |
          set -euo pipefail
          # §7 THE MODULE CHAIN at anchor 6 (the Kill-#14 architecture at half
          # scale) — every module its own lean process, olean ladder in
          # dependency order. Kills `hob : obstructionCheck = true`.
          mkdir -p oleans && export LEAN_PATH="$PWD/oleans"
          : > kernel14.log
          for M in ExactF62 F62DataS F62DataC F62DataD1 F62DataD2 F62Chain F62SweepA F62SweepB F62Coins F62FM0 F62FM1 F62DD0 F62DD1 F62DD2 F62DD3 F62DD4 F62DD5 F62DDm0 F62Asm0 F62Asm1 F62AllA F62AllB F62AllC F62AllD F62All; do
            echo "=== $M ===" >> kernel14.log
            lake env lean -o oleans/$M.olean problem404-q3-chain/$M.lean 2>&1 | tee -a kernel14.log
          done
          ! grep -E 'error:|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.' kernel14.log
          grep -F "133" kernel14.log | head -3
          grep -F "129" kernel14.log | head -3
          grep -F "'obstructionCheck_true' depends on axioms: [propext, Quot.sound]" kernel14.log
          grep -F "'erdos404_f62_final' depends on axioms: [propext, Classical.choice, Quot.sound]" kernel14.log
          echo EXACT_F62_CHAIN_KERNEL_GREEN=1

      - name: "Kernel 15 - Erdos 1108 LEGENDRE PARITY LAW (v₂(n!) = n − s₂(n): the Λ-spine + EXPLICIT CASCADE + SQUARE-PARITY INVARIANT, Kill #19)"
        shell: bash
        run: |
          set -euo pipefail
          # The Λ(j) = 2j − s₂(j) spine of the #1108 engine made explicit:
          #   v₂(n!) + s₂(n) = n          (legendre_v2_fact — Legendre at p=2)
          #   Λ(j) = 2j − s₂(j)           (legendre_lam — the spine)
          #   v₂(Σ a!) = (2j₀ − s₂(j₀)) + v₂(C)   (explicit_cascade)
          #   square ⟹ s₂(j₀) ≡ v₂(C) (mod 2)     (square_parity_s2 — the payoff)
          lake env lean problem1108-subset-kernel/SubsetKernelLaw.lean 2>&1 | tee legendre.log
          ! grep -E 'error:|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.' legendre.log
          grep -F "(0, 1, 3, 8, 1)" legendre.log
          grep -F "(8, 8, 8)" legendre.log
          grep -F "(20, 20)" legendre.log
          grep -F "(4, 4)" legendre.log
          grep -F "(1, 1)" legendre.log
          grep -E "'legendre_v2_fact' (does not depend on any axioms|depends on axioms)" legendre.log
          grep -E "'legendre_lam' (does not depend on any axioms|depends on axioms)" legendre.log
          grep -E "'explicit_cascade' (does not depend on any axioms|depends on axioms)" legendre.log
          grep -E "'square_parity_s2' (does not depend on any axioms|depends on axioms)" legendre.log
          python3 problem1108-subset-kernel/verify_legendre.py
          echo LEGENDRE_PARITY_KERNEL_GREEN=1

      - name: "Build the vendored ARSENAL (BOSS's own mathematics: erdosternary2 + HC-PROOF)"
        shell: bash
        run: |
          set -euo pipefail
          # erdosternary2 (bulldoze branch) ternary digit laws + HC-PROOF (research branch)
          # carry machinery + dyadic v2r scaling — vendored at arsenal/, exact Mathlib pin match.
          lake build Arsenal.ErdosTernary2.Basic
          lake build Arsenal.CardinalWorlds
          lake build Arsenal.CardinalWorldsV2
          lake build Arsenal
          echo ARSENAL_BUILD_GREEN=1

      - name: "Kernel 16 - Erdos 686 PELL-RATIO STRIKE (square family identity + 90-witness non-square table + arsenal bridge)"
        shell: bash
        run: |
          set -euo pipefail
          lake env lean problem686-pell-ratio/Erdos686.lean 2>&1 | tee erdos686.log
          ! grep -E 'error:|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.' erdos686.log
          grep -F "ERDOS686_KERNEL_GREEN" erdos686.log
          grep -F "90" erdos686.log | head -2
          grep -F "true" erdos686.log | head -2
          grep -E "'erdos686_square_family_identity' (does not depend on any axioms|depends on axioms)" erdos686.log
          grep -E "'erdos686_table_all' (does not depend on any axioms|depends on axioms)" erdos686.log
          grep -E "'erdos686_v2r_scaling_witnesses' (does not depend on any axioms|depends on axioms)" erdos686.log
          python3 problem686-pell-ratio/pell_battery.py
          echo ERDOS686_PELL_RATIO_KERNEL_GREEN=1

      - name: "Kernel 17 - Erdos 727 FACTORIAL-SQUARE STRIKE (n=208 witness theorem: (210)!^2 | (416)! + tightness + cascade + arsenal bridge)"
        shell: bash
        run: |
          set -euo pipefail
          lake env lean problem727-factorial-square/FactorialSquare.lean 2>&1 | tee factorial-square.log
          ! grep -E 'error:|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.' factorial-square.log
          grep -F "ERDOS727_KERNEL_GREEN" factorial-square.log
