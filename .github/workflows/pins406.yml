name: Erdos 406 Pins + Ghost (dedicated runners)
on:
  push:
    branches: [campaign]
    paths:
      - problem406-ternary-powers/PiCollapse406Pins.lean
      - problem406-ternary-powers/GhostExtinction406.lean
      - problem406-ternary-powers/battery406f.py
      - problem406-ternary-powers/battery406g.py
      - KernelChamber406/**
      - .github/workflows/pins406.yml
  workflow_dispatch:

# S089h RESTRUCTURE: the single-job 4-module loop died at the hosted-runner
# wall (~50 min: 49:01 / 51:07 / 50:01 observed) with step=None and no
# artifacts — the runner itself is killed, `if: always()` cannot fire.
# The fix: ONE MODULE PER JOB with actions/cache carrying the .lake/build
# oleans down the needs-chain. Each job = install (2m) + cache (0.5m) +
# Arsenal prebuild (3m, cached after spine) + ONE module (<=25m) ~= 10-15m
# — far under the wall. Per-job conclusions = per-module verdicts in the
# API. Each job greps the receipts its own module prints; the crown jobs
# re-print the full consolidated receipt blocks, so they run the complete
# original gate sets. Log artifacts upload after every step (survives
# runner death for completed steps).

jobs:
  pins-spine:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v5
    - name: Install Lean Mathlib
      run: |
        set -euo pipefail
        curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.elan/bin:$PATH"
        lake update
        lake exe cache get
      shell: bash
    - name: MEMORY SHIELD (10GB swap absorbs elaboration spikes)
      run: |
        if [ ! -f /swapfile2 ]; then
          sudo fallocate -l 10G /swapfile2 || sudo dd if=/dev/zero of=/swapfile2 bs=1M count=10240
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
        fi
        sudo swapon /swapfile2 2>/dev/null || true
        free -h
      shell: bash
    - name: Restore lake oleans (chain cache)
      uses: actions/cache@v4
      with:
        path: .lake/build
        key: pins406-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          pins406-${{ runner.os }}-
    - name: "Pins 1/4: PinsSpine (the ghost rays, the fixed points)"
      run: |
        set -euo pipefail
        : > kernel74b.log
        lake build Arsenal.ErdosTernary2.Basic Arsenal.CardinalWorlds Arsenal.CardinalWorldsV2 2>&1 | tee -a kernel74b.log
        set +e
        timeout 1500 lake build KernelChamber406.PinsSpine 2>&1 | tee -a kernel74b.log
        RC=${PIPESTATUS[0]}
        set -e
        if [ "$RC" -ne 0 ]; then echo "PINS_PART_FAILED module=PinsSpine rc=$RC"; exit 1; fi
        if grep -qE 'error[:(]|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.' kernel74b.log; then echo "PINS_NEGATIVE_GATE_TRIPPED"; grep -E 'error[:(]|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.' kernel74b.log; exit 1; fi
      shell: bash
    - if: always()
      name: "Upload pins-spine log"
      uses: actions/upload-artifact@v4
      with:
        name: pins-spine-log
        path: kernel74b.log
        retention-days: 30

