name: Erdos 406 Pins + Ghost (dedicated runners)
on:
  push:
    branches: [campaign]
    paths:
      - problem406-ternary-powers/PiCollapse406Pins.lean
      - problem406-ternary-powers/GhostExtinction406.lean
      - problem406-ternary-powers/battery406f.py
      - problem406-ternary-powers/battery406g.py
      - KernelChamber406/**
      - .github/workflows/pins406.yml
  workflow_dispatch:

# S089k THE SPLIT-OF-THE-SPLIT: the half modules elaborated 10-17 min and
# raced the hosted-runner reaper strike window (11-18 min) — photo-finish,
# lost stochastically (GhostHalf: green in ~10 min in run 45558536529,
# killed at 16.6 min in run 45573897066 — same code, different runner).
# Every module now targets <9 min: word (receipts) and pins (engine) are
# separate olean-cached modules. Per-job conclusions = automatic bisection.
# The retry law: reaper kills (shutdown signal / exit 143, zero Lean
# errors) are retried via rerun-failed-jobs until every module goes green.

jobs:
  pins-spine:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v5
    - name: Install Lean Mathlib
      run: |
        set -euo pipefail
        for i in 1 2 3 4 5; do
          if curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan_init.sh -o /tmp/elan_init.sh; then break; fi
          echo "raw fetch retry $i"; sleep 10
        done
        if [ ! -s /tmp/elan_init.sh ]; then
          echo "raw.githubusercontent down - API fallback"
          curl -sSf -H "Authorization: token ${{ github.token }}" -H "Accept: application/vnd.github.raw" https://api.github.com/repos/leanprover/elan/contents/elan-init.sh -o /tmp/elan_init.sh
        fi
        sh /tmp/elan_init.sh -y --default-toolchain leanprover/lean4:v4.33.0-rc2
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.elan/bin:$PATH"
        lake update
        lake exe cache get
      shell: bash
    - name: MEMORY SHIELD (10GB swap absorbs elaboration spikes)
      run: |
        if [ ! -f /swapfile2 ]; then
          sudo fallocate -l 10G /swapfile2 || sudo dd if=/dev/zero of=/swapfile2 bs=1M count=10240
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
        fi
        sudo swapon /swapfile2 2>/dev/null || true
        free -h
      shell: bash
    - name: Restore lake oleans (chain cache)
      uses: actions/cache@v4
      with:
        path: .lake/build
        key: pins406-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          pins406-${{ runner.os }}-
    - name: "Pins 1/5: PinsSpine (the ghost rays, the fixed points)"
      run: |
        set -euo pipefail
        : > kernel74b.log
        lake build Arsenal.ErdosTernary2.Basic Arsenal.CardinalWorlds Arsenal.CardinalWorldsV2 2>&1 | tee -a kernel74b.log
        set +e
        timeout 1500 lake build KernelChamber406.PinsSpine 2>&1 | tee -a kernel74b.log
        RC=${PIPESTATUS[0]}
        set -e
        if [ "$RC" -ne 0 ]; then echo "PINS_PART_FAILED module=PinsSpine rc=$RC"; exit 1; fi
        if grep -qE 'error[:(]|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.' kernel74b.log; then echo "PINS_NEGATIVE_GATE_TRIPPED"; grep -E 'error[:(]|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.' kernel74b.log; exit 1; fi
      shell: bash
    - if: always()
      name: "Upload pins-spine log"
      uses: actions/upload-artifact@v4
      with:
        name: pins-spine-log
        path: kernel74b.log
        retention-days: 30

