        RC=${PIPESTATUS[0]}
        set -e
        if [ "$RC" -ne 0 ]; then echo "HC2_SHARD_BUILD_FAILED_OR_TIMEOUT_RC=$RC"; exit 1; fi
        if grep -qE 'error[:(]|unknown identifier|unsolved goals' hc2-s0.log; then
          echo "HC2_NEGATIVE_GATE_TRIPPED (errors)"
          grep -E 'error[:(]|unknown identifier|unsolved goals' hc2-s0.log | head -40
          exit 1
        fi
        BAD_SORRY=$(grep -E "sorryAx|declaration uses .sorry." hc2-s0.log | grep -vE "GSTLawStackRound|deepmind_problem_406" || true)
        if [ -n "$BAD_SORRY" ]; then
          echo "HC2_SORRY_OUTSIDE_WHITELIST"
          echo "$BAD_SORRY" | head -20
          exit 1
        fi
        echo "HC2 SHARD s0 MODULES BUILT:"
        grep -cE '(Built|Replayed) HCUniverse2' hc2-s0.log || true
        echo HC2_S0_GREEN=1
      shell: bash
    - if: always()
      uses: actions/upload-artifact@v4
      with:
        name: hc2-s0-log
        path: hc2-s0.log
        retention-days: 30

