# THE COMPLETE VENDORED UNIVERSE 2 (S094 r2) — the FULL build of BOSS's latest
# branch (kyo-oo/HC-PROOF @ research/gpt6-gst-hypothesis-part1-chow-square-
# 20261110, head 59e5d093), sharded into 10 parallel kernel jobs. EVERY
# proof-side module is a build root (884). THE EXCLUSION LAW (r2): research/
# pin/** (44 verbatim Mathlib source pins — reference artifacts; building
# would redeclare Mathlib; the dash in the dir name is not a legal module
# component), pi.lean/fsb.lean (Mathlib module-system syntax pins), repairs/
# ** (10 staging fragments spliced into their target modules — not
# standalone by design) are carried as FILES (the copy is entire) but not
# build roots.
name: HCUniverse2 full build
on:
  push:
    paths:
      - 'HCUniverse2/**'
      - 'lakefile.toml'
      - '.github/workflows/hcuniverse2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel-hc2-s0:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - uses: actions/checkout@v5
    - name: Install Lean Mathlib
      run: |
        set -euo pipefail
        for i in 1 2 3 4 5; do
          if curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2; then
            if elan toolchain install leanprover/lean4:v4.33.0-rc2 2>/dev/null || true; then break; fi
          fi
          echo "ELAN_INSTALL_RETRY attempt=$i failed; sleeping 20s"
          sleep 20
        done
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.elan/bin:$PATH"
        for i in 1 2 3; do lake update && break; echo "LAKE_UPDATE_RETRY attempt=$i"; sleep 15; done
        for i in 1 2 3; do lake exe cache get && break; echo "CACHE_GET_RETRY attempt=$i"; sleep 15; done
      shell: bash
    - name: "HCUniverse2 shard s0 (89 modules) — r2 repair round (dotted targets, InfiniteCycle congrArg port, Round32 repair + imports, pin/staging exclusion law)"
      run: |
        set -euo pipefail
        : > hc2-s0.log
        set +e
        timeout 18000 lake build HCUniverse2.CardinalWorlds HCUniverse2.CardinalWorldsPrefixClassifier HCUniverse2.CardinalWorldsV2 HCUniverse2.ComparatorSmokeChallenge HCUniverse2.ComparatorSmokeSolution HCUniverse2.GST2DMixedEmergence HCUniverse2.GST2DMixedEmergenceUpgrade HCUniverse2.GSTActualXHodgeResidualProjection HCUniverse2.GSTAllDegreeCurvatureMemory HCUniverse2.GSTAllDegreeHodgeStarCMFold HCUniverse2.GSTAllDimensionProjectivePrimitiveCycles HCUniverse2.GSTAllNConnectedCurvatureBirth HCUniverse2.GSTAllNConnectedCurvatureGeometricClosure HCUniverse2.GSTAnalyticAbsorption HCUniverse2.GSTAnalyticAbsorptionV2 HCUniverse2.GSTBladeWave HCUniverse2.GSTCMAllIndexedNonzeroForcing HCUniverse2.GSTCMFiniteGeometricDegreeDescent HCUniverse2.GSTCMNumberManipulationDualDetector HCUniverse2.GSTCMNumberManipulationTrace HCUniverse2.GSTCMQuadraticNativeRankForcing HCUniverse2.GSTCanonicalCarryDynamics HCUniverse2.GSTCanonicalPointGeometryStage2G HCUniverse2.GSTCanonicalPolarizedHodgeGhost HCUniverse2.GSTCanonicalSevenAxisBridge HCUniverse2.GSTCanonicalTailLTE HCUniverse2.GSTCanonicalTailStateIso HCUniverse2.GSTCardinalAlephOneChowDescent HCUniverse2.GSTCardinalConnectedNavigation HCUniverse2.GSTCardinalGradedIncidenceBirth HCUniverse2.GSTCardinalHilbertComponentSource HCUniverse2.GSTCardinalIndexedNativeHodge HCUniverse2.GSTCardinalLowHalfLefschetzTransfer HCUniverse2.GSTCardinalSimultaneousOriginalXCompiler HCUniverse2.GSTCardinalTopologicalFiniteWindowLanding HCUniverse2.GSTCardinalWorldHodgeStarPart1 HCUniverse2.GSTCarrierAlgebraFlatComplex HCUniverse2.GSTCarrierMechanismVerdictCertificate HCUniverse2.GSTCausalFoldDefect HCUniverse2.GSTCausalPairingGraphs HCUniverse2.GSTClassicalHodgeActualCommutatorRankGain HCUniverse2.GSTClassicalHodgeActualGeometricIdentityClosure HCUniverse2.GSTClassicalHodgeActualGeometricIrreducibility HCUniverse2.GSTClassicalHodgeActualNoncommutativeNativeFrame HCUniverse2.GSTClassicalHodgeAlgebraicArsenalSaturation HCUniverse2.GSTClassicalHodgeAmb