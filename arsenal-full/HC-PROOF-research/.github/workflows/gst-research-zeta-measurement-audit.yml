name: GST Zeta Measurement Audit
on:
  push:
    branches:
      - mathbox/bd23-single-operator-charge-wedge
    paths:
      - 'GSTResearchZetaMeasurementAudit.lean'
      - '.github/workflows/gst-research-zeta-measurement-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-research-zeta-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Restore pinned Lean installation
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore compiled dependency cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-research-zeta-audit
          restore-keys: |
            hc-lean-incremental-${{ runner.os }}-
      - name: Kernel verify zeta certificate iff native seed
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "ResearchZetaMeasurementAudit"
          roots = [
            "GSTMathboxCorrectedZetaGeometry",
            "GSTMathboxCorrectedZetaInfinite",
            "GSTMathboxCorrectedZetaActualHodge",
            "GSTResearchZetaMeasurementAudit"
          ]
          EOF
          if lake build ResearchZetaMeasurementAudit > research-zeta-audit-lean.log 2>&1; then
            echo "LEAN PASSED: free corrected zeta scalar equivalence audit"
          else
            grep -nE 'error:|sorryAx|✖' research-zeta-audit-lean.log | tail -n 130 || true
            tail -n 90 research-zeta-audit-lean.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" research-zeta-audit-lean.log; then
            echo "Lean trust audit failure"
            exit 1
          fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-zeta-certification-lean-log
          path: research-zeta-audit-lean.log
          if-no-files-found: warn
