name = "ErdosWeakProblems"
version = "0.1.0"

# The one-shot kill campaign: Erdos open problems weaker than #406.
# Weapons: Kyo-oo's ternary/dyadic mathematics (see README.md).
# All kills are core-Lean files verified by GitHub CI via `lake env lean`
# with Mathlib resolved at the pinned toolchain below.

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0-rc2"

# The vendored arsenal (Session 028): BOSS's own mathematics as a buildable
# library — erdosternary2 (bulldoze branch) + HC-PROOF (research branch).
[[lean_lib]]
name = "Arsenal"
globs = ["Arsenal.+"]

# The vendored OFFICIAL DeepMind formal-conjectures definitions (W82):
# google-deepmind/formal-conjectures @ 2207c54d, module-system syntax
# stripped, declarations byte-identical. These carry the official
# definitions behind the DM_61/DM_107/DM_142 challenge statements.
[[lean_lib]]
name = "FC"
globs = ["FC.+"]

# THE MONOLITH CHAMBER (S085 r7, BOSS order USE MY MATHS): the 39-file mission
# closure of BOSS's own HC-PROOF-research monolith, vendored verbatim from
# arsenal-full (53 import rewrites, byte-identical declarations). This is the
# tailF chamber: the dimensional laws, the row+tower decomposition, the
# Omega-wave law, the boundary, the six-adic machinery, the vertical telescope,
# the u-jump laws, the navigation, the forced-digit-2 no-22, the tactic core.
# Toolchain: the monolith's own pin (Lean v4.33.0-rc2 + Mathlib v4.33.0-rc2)
# — identical to the campaign pin, zero version friction.
[[lean_lib]]
name = "Monolith"
globs = ["Monolith.+"]

# THE MONOLITH GATE (S085 r9, BOSS order FINISH THE PROOF): the 88-file world
# of BOSS's own source monolith (kyo-oo/erdosternary2, branch
# sol/kyo-gate-universe-wire, head cb29501), vendored verbatim (190 import
# rewrites, byte-identical declarations): the 84-file ErdosTernary2 import
# closure — including THE TERMINAL IDENTITY theorem erdos_even_conjecture_
# iff_tailF at ErdosTernary2.lean:18425, kernel-certified both directions,
# axiom profile [propext, choice, Quot.sound] — plus the 4-file tailF proof
# chamber (GSTTailFProof / GSTTailFFourthDimension / GSTGraphV2Ontological /
# GSTGraphV2PowerThreeWaveObservation). Toolchain: the monolith's own pin
# (Lean v4.33.0-rc2 + Mathlib v4.33.0-rc2) — identical to the campaign pin.
# CO-IMPORT LAW: MonolithGate and Monolith share declaration names (the
# branches diverged); NEVER import both into the same file.
[[lean_lib]]
name = "MonolithGate"
globs = ["MonolithGate.+"]
